<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📡 IA Watch — Sofinco / MCD — Mai 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  a:hover { opacity: 0.8; }
  button:hover { opacity: 0.9; }
  .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
  .input-field { width: 100%; padding: 12px 16px; border-radius: 8px; border: 1px solid #e0e0e0; margin-bottom: 16px; font-size: 14px; }
  .btn-primary { background: #009597; color: white; padding: 12px 24px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }
  .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  .admin-table th, .admin-table td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
  .admin-tabs { display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 1px solid #e0e2e8; padding-bottom: 10px; }
  .admin-tab-btn { padding: 8px 16px; border-radius: 8px; border: none; background: transparent; color: #666E8A; font-weight: 600; cursor: pointer; }
  .admin-tab-btn.active { background: #00959715; color: #009597; }
  .admin-card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e0e2e8; margin-bottom: 15px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 11px; font-weight: 700; color: #071621; margin-bottom: 6px; text-transform: uppercase; }
  .form-control { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #e0e2e8; font-family: inherit; font-size: 14px; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const TEAL = "#009597";
const DARK_TEAL = "#006466";
const SLATE = "#666E8A";
const NAVY = "#071621";
const GREEN = "#2D8E57";
const ORANGE = "#E07A2F";
const CORAL = "#F47682";
const BLUE = "#3A7CC3";
const VIOLET = "#7030A0";

// --- Supabase Config ---
const SUPABASE_URL = "__SUPABASE_URL__"; 
const SUPABASE_ANON_KEY = "__SUPABASE_ANON_KEY__";
const supabaseClient = (SUPABASE_URL && SUPABASE_URL !== "__SUPABASE_URL__") 
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

// --- Data Defaults ---
const kpis = [
  { value: "$2 520 Mds", label: "Dépenses IA mondiales 2026", sub: "+44% YoY", source: "Gartner" },
  { value: "28%", label: "Taux de succès ROI", sub: "use cases I&O", source: "Gartner" },
  { value: "17%", label: "Organisations ayant déployé des agents", sub: "vs 60%+ prévu sous 2 ans", source: "Gartner" },
  { value: "50%", label: "CEOs dont le poste dépend du succès IA", sub: "72% sont décideurs principaux", source: "BCG" },
];

const axes = [
  {
    id: 1, color: TEAL, icon: "🤖", tag: "AXE 1", title: "Agents autonomes & gouvernance",
    assertion: "60% d'intention de déploiement mais 17% de réalité — la gouvernance devient le facteur limitant",
    bullets: ["BCG AI Radar 2026 : 30% du budget IA 2026 alloué à l'agentique", "Bain : valeur se mesure en contexte retenu", "Google Cloud Next 2026 : focus sur gouvernance"],
    implication: "Poser les fondations avant la prolifération.",
    sources: "BCG, AI Radar 2026"
  }
];

const perspectives = [
  { type: "Hypothèse", text: "Le creux de désillusion se prolonge au S2 2026.", color: ORANGE },
  { type: "Signal faible", text: "Deskilling silencieux dans les fonctions support.", color: CORAL }
];

// --- Sub-Components ---
const KPICard = ({ value, label, sub, source, delay }) => {
  const [visible, setVisible] = useState(false);
  useEffect(() => { setTimeout(() => setVisible(true), delay); }, [delay]);
  return (
    <div style={{ flex: "1 1 0", minWidth: 140, textAlign: "center", padding: "20px 12px", opacity: visible ? 1 : 0, transform: visible ? "translateY(0)" : "translateY(20px)", transition: "all 0.6s ease" }}>
      <div style={{ fontSize: 28, fontWeight: 800, color: TEAL }}>{value}</div>
      <div style={{ fontSize: 11, fontWeight: 700, color: DARK_TEAL, marginTop: 4 }}>{label}</div>
      <div style={{ fontSize: 9, color: SLATE }}>{sub}</div>
    </div>
  );
};

const AxeCard = ({ axe }) => {
  const [isOpen, setIsOpen] = useState(false);
  return (
    <div onClick={() => setIsOpen(!isOpen)} style={{ background: "#fff", borderRadius: 12, border: `1.5px solid ${isOpen ? axe.color : "#eee"}`, padding: "20px", cursor: "pointer", transition: "all 0.3s ease" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 15 }}>
        <div style={{ fontSize: 24, background: `${axe.color}15`, padding: 10, borderRadius: 10 }}>{axe.icon}</div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 10, fontWeight: 800, color: axe.color }}>{axe.tag}</div>
          <div style={{ fontSize: 16, fontWeight: 700, color: NAVY }}>{axe.title}</div>
        </div>
      </div>
      {isOpen && (
        <div style={{ marginTop: 15, paddingTop: 15, borderTop: "1px solid #eee" }}>
          {axe.bullets.map((b, i) => <div key={i} style={{ fontSize: 13, marginBottom: 8 }}>• {b}</div>)}
          <div style={{ background: `${axe.color}08`, padding: 12, borderRadius: 8, marginTop: 10 }}>
             <div style={{ fontSize: 10, fontWeight: 800, color: axe.color }}>IMPLICATION</div>
             <div style={{ fontSize: 13 }}>{axe.implication}</div>
          </div>
        </div>
      )}
    </div>
  );
};

const PerspectiveCard = ({ p }) => (
  <div style={{ background: "white", padding: "20px", borderRadius: "12px", borderLeft: `4px solid ${p.color}`, boxShadow: "0 2px 8px rgba(0,0,0,0.05)" }}>
    <div style={{ fontSize: "10px", fontWeight: "800", color: p.color, marginBottom: "8px", textTransform: "uppercase" }}>{p.type}</div>
    <div style={{ fontSize: "14px", color: NAVY, lineHeight: "1.5" }}>{p.text}</div>
  </div>
);

const Overview = ({ siteData }) => (
  <div style={{ animation: "fadeIn 0.5s ease" }}>
    <div style={{ background: "#fff", padding: "32px", borderRadius: "16px", marginBottom: "24px", border: "1px solid #E0E2E8" }}>
      <h2 style={{ fontSize: "24px", fontWeight: "800", color: NAVY, marginBottom: "16px" }}>Synthèse Stratégique</h2>
      <p style={{ color: SLATE, lineHeight: "1.6" }}>Analyse des tendances critiques pour le S1 2026.</p>
    </div>
    <div style={{ display: "flex", flexWrap: "wrap", background: "#fff", borderRadius: "16px", padding: "10px", boxShadow: "0 10px 30px rgba(0,0,0,0.1)", marginBottom: "30px" }}>
      {siteData.kpis.map((k, i) => <KPICard key={i} {...k} delay={i * 100} />)}
    </div>
  </div>
);

// --- Auth Hook ---
const useAuth = () => {
  const [session, setSession] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (!supabaseClient) { setLoading(false); return; }
    supabaseClient.auth.getSession().then(({ data: { session } }) => { setSession(session); setLoading(false); });
    const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => { setSession(session); });
    return () => subscription.unsubscribe();
  }, []);
  return { session, loading };
};

// --- Page Components ---
const LoginPage = ({ onBack }) => {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(null);
  const handleLogin = async (e) => {
    e.preventDefault();
    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) setError(error.message);
  };
  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#071621", padding: "20px" }}>
      <div style={{ background: "white", padding: "40px", borderRadius: "20px", width: "100%", maxWidth: "400px" }}>
        <button onClick={onBack} style={{ background: "none", border: "none", color: TEAL, cursor: "pointer", marginBottom: "20px", fontWeight: "700" }}>← Retour</button>
        <h2 style={{ marginBottom: "24px", textAlign: "center" }}>Connexion Membre</h2>
        <form onSubmit={handleLogin}>
          <input className="input-field" type="email" placeholder="Email" value={email} onChange={e => setEmail(e.target.value)} required />
          <input className="input-field" type="password" placeholder="Mot de passe" value={password} onChange={e => setPassword(e.target.value)} required />
          {error && <div style={{ color: CORAL, fontSize: "12px", marginBottom: "15px" }}>{error}</div>}
          <button type="submit" className="btn-primary" style={{ width: "100%" }}>Se Connecter</button>
        </form>
      </div>
    </div>
  );
};

const AdminDashboard = ({ user, onBack, siteData, onUpdateData }) => {
  const [activeTab, setActiveTab] = useState("stats");
  const [users, setUsers] = useState([]);
  useEffect(() => {
    const fetchUsers = async () => {
      const { data } = await supabaseClient.from('profiles').select('*');
      if (data) setUsers(data);
    };
    fetchUsers();
  }, []);
  return (
    <div style={{ padding: "40px", maxWidth: "1200px", margin: "0 auto" }}>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: "30px" }}>
        <button onClick={onBack} className="btn-primary">← Retour</button>
        <h2 style={{ fontWeight: 800 }}>Administration</h2>
        <div style={{ fontSize: 12, fontWeight: 700 }}>{user.email}</div>
      </div>
      <div className="admin-tabs">
        <button className={`admin-tab-btn ${activeTab === 'stats' ? 'active' : ''}`} onClick={() => setActiveTab('stats')}>Stats</button>
        <button className={`admin-tab-btn ${activeTab === 'users' ? 'active' : ''}`} onClick={() => setActiveTab('users')}>Users</button>
      </div>
      {activeTab === 'stats' && (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
          <div className="admin-card"><h3>Total Users</h3><p style={{ fontSize: 40, fontWeight: 800 }}>{users.length}</p></div>
          <div className="admin-card"><h3>Admins</h3><p style={{ fontSize: 40, fontWeight: 800 }}>{users.filter(u => u.is_admin).length}</p></div>
        </div>
      )}
      {activeTab === 'users' && (
        <div className="admin-card">
          <table className="admin-table">
            <thead><tr><th>Email</th><th>Admin</th></tr></thead>
            <tbody>{users.map((u, i) => <tr key={i}><td>{u.email}</td><td>{u.is_admin ? "✅" : "❌"}</td></tr>)}</tbody>
          </table>
        </div>
      )}
    </div>
  );
};

const WelcomeScreen = ({ onExplore, siteData }) => (
  <div style={{ minHeight: "100vh", background: "#071621", color: "#fff", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "40px 20px", textAlign: "center", overflow: "hidden" }}>
    <div style={{ animation: "fadeInUp 0.8s ease" }}>
      <div style={{ fontSize: 60, marginBottom: 20 }}>{siteData.settings.emoji}</div>
      <h1 style={{ fontSize: "clamp(40px, 8vw, 72px)", fontWeight: 900, marginBottom: 20 }}>
        <span style={{ color: TEAL }}>{siteData.settings.title.split(' ')[0]}</span> {siteData.settings.title.split(' ').slice(1).join(' ')}
      </h1>
      <p style={{ fontSize: 22, color: "#A0AEC0", maxWidth: 700, margin: "0 auto 40px" }}>{siteData.settings.subtitle}</p>
      <div style={{ display: "flex", gap: 20, justifyContent: "center" }}>
        <button onClick={onExplore} style={{ padding: "16px 40px", borderRadius: 12, background: TEAL, color: "white", border: "none", fontWeight: 700, cursor: "pointer", boxShadow: `0 0 20px ${TEAL}60` }}>Explorer le Rapport</button>
      </div>
    </div>
  </div>
);

// --- Main App ---
const App = () => {
  const { session, loading: authLoading } = useAuth();
  const [showWelcome, setShowWelcome] = useState(true);
  const [isAdminView, setIsAdminView] = useState(false);
  const [section, setSection] = useState("overview");
  const [siteData, setSiteData] = useState({ kpis, axes, perspectives, settings: { title: "IA WATCH", emoji: "📡", subtitle: "Impact de l'IA sur l'économie..." } });

  useEffect(() => {
    const fetchSite = async () => {
      if (!supabaseClient) return;
      const { data } = await supabaseClient.from('site_content').select('*');
      if (data) {
        const newData = { ...siteData };
        data.forEach(item => { if (newData[item.key]) newData[item.key] = item.value; if (item.key === 'settings') newData.settings = item.value; });
        setSiteData(newData);
      }
    };
    fetchSite();
  }, []);

  if (showWelcome) return <WelcomeScreen onExplore={() => setShowWelcome(false)} siteData={siteData} />;
  if (authLoading) return <div style={{ minHeight: "100vh", background: "#071621", display: "flex", alignItems: "center", justifyContent: "center", color: "white" }}>Chargement...</div>;
  if (!session) return <LoginPage onBack={() => setShowWelcome(true)} />;
  if (isAdminView && session.user.email.includes('admin')) return <AdminDashboard user={session.user} onBack={() => setIsAdminView(false)} siteData={siteData} onUpdateData={setSiteData} />;

  return (
    <div style={{ minHeight: "100vh", background: "#F5F6F8", fontFamily: "inherit" }}>
      <div style={{ background: "#fff", borderBottom: `2px solid ${TEAL}`, padding: "16px 24px", display: "flex", justifyContent: "space-between", alignItems: "center", position: "sticky", top: 0, zIndex: 100 }}>
        <div onClick={() => setShowWelcome(true)} style={{ cursor: "pointer" }}>
          <div style={{ fontSize: 10, fontWeight: 700, color: TEAL }}>SOFINCO / MCD</div>
          <div style={{ fontSize: 17, fontWeight: 700 }}>{siteData.settings.title} — 2026</div>
        </div>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          {session.user.email.includes('admin') && <button onClick={() => setIsAdminView(true)} style={{ background: `${TEAL}15`, color: TEAL, border: "none", padding: "6px 12px", borderRadius: 6, cursor: "pointer", fontSize: 12, fontWeight: 700 }}>Admin ⚙️</button>}
          <button onClick={() => supabaseClient.auth.signOut()} style={{ padding: "6px 12px", borderRadius: 6, border: "1px solid #ddd", fontSize: 12, cursor: "pointer" }}>Déconnexion</button>
          {["overview", "axes", "perspectives"].map(s => (
            <button key={s} onClick={() => setSection(s)} style={{ padding: "8px 16px", borderRadius: 8, border: "none", background: section === s ? TEAL : "transparent", color: section === s ? "#fff" : SLATE, fontWeight: 700, cursor: "pointer" }}>{s.toUpperCase()}</button>
          ))}
        </div>
      </div>
      <div style={{ padding: "40px 24px", maxWidth: 1000, margin: "0 auto" }}>
        {section === "overview" && <Overview siteData={siteData} />}
        {section === "axes" && <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>{siteData.axes.map(axe => <AxeCard key={axe.id} axe={axe} />)}</div>}
        {section === "perspectives" && <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24 }}>{siteData.perspectives.map((p, i) => <PerspectiveCard key={i} p={p} />)}</div>}
      </div>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
